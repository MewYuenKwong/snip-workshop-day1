name: Build bundle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # No push trigger: GitHub runs a push workflow from the file on the pushed branch,
  # and this workflow only exists on main, so backend/frontend/cli pushes would not fire it.

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and push bundle
        run: node scripts/build-bundle.mjs --push